<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌿 Daily Carbon News - 全球碳中和日报</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f0f4f0;
            --card-bg: #ffffff;
            --text: #1a2a1a;
            --text-secondary: #5a6a5a;
            --accent: #2d8a4e;
            --accent-light: #e8f5e9;
            --accent-dark: #1b5e20;
            --tag-bg: #e8f5e9;
            --tag-text: #2d8a4e;
            --border: #dce8dc;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            --radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, #1b5e20 0%, #2d8a4e 50%, #43a047 100%);
            color: white;
            padding: 2rem 1.5rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 50%, rgba(255,255,255,0.05) 0%, transparent 50%);
            pointer-events: none;
        }
        header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            position: relative;
        }
        header p {
            opacity: 0.85;
            margin-top: 0.5rem;
            font-size: 1rem;
            position: relative;
        }
        .update-badge {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            padding: 0.3rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-top: 0.8rem;
            backdrop-filter: blur(4px);
        }
        .update-badge .date {
            font-weight: 600;
        }

        /* Stats bar */
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 2rem;
            padding: 1rem 1.5rem;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }
        .stat-item {
            text-align: center;
        }
        .stat-item .num {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
        }
        .stat-item .label {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* Filter bar */
        .filter-bar {
            padding: 1rem 1.5rem;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: center;
        }
        .filter-bar .label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-right: 0.5rem;
        }
        .filter-btn {
            padding: 0.35rem 0.8rem;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text);
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        .filter-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }
        .keyword-tag.filter-btn {
            background: var(--tag-bg);
            color: var(--tag-text);
            border-color: transparent;
        }
        .keyword-tag.filter-btn.active {
            background: var(--accent);
            color: white;
        }
        .keyword-tag.filter-btn:hover {
            border-color: var(--accent);
        }

        /* Search */
        .search-box {
            padding: 1rem 1.5rem;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
        }
        .search-box input {
            width: 100%;
            max-width: 500px;
            padding: 0.6rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-box input:focus {
            border-color: var(--accent);
        }

        /* Main content */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 1.5rem;
        }

        /* News list */
        .news-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .news-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 1.25rem 1.5rem;
            box-shadow: var(--shadow);
            transition: transform 0.15s, box-shadow 0.15s;
            border-left: 4px solid var(--accent);
        }
        .news-card:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .news-card .title {
            font-size: 1.1rem;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 0.5rem;
        }
        .news-card .title a {
            color: var(--text);
            text-decoration: none;
        }
        .news-card .title a:hover {
            color: var(--accent);
            text-decoration: underline;
        }
        .news-card .title-zh {
            font-size: 1.1rem;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 0.15rem;
        }
        .news-card .title-zh a {
            color: var(--text);
            text-decoration: none;
        }
        .news-card .title-zh a:hover {
            color: var(--accent);
            text-decoration: underline;
        }
        .news-card .title-en {
            font-size: 0.82rem;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
        }

        .news-card .meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.8rem;
            font-size: 0.82rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }
        .news-card .meta .source {
            font-weight: 600;
            color: var(--accent-dark);
        }
        .news-card .meta .time {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .news-card .snippet {
            font-size: 0.88rem;
            color: var(--text-secondary);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .news-card .keywords {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-top: 0.6rem;
        }
        .news-card .keywords .kw {
            display: inline-block;
            background: var(--tag-bg);
            color: var(--tag-text);
            padding: 0.15rem 0.6rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 4rem 1rem;
            color: var(--text-secondary);
        }
        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        .empty-state h3 {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            color: var(--text);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
            font-size: 0.82rem;
        }
        footer a {
            color: var(--accent);
            text-decoration: none;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 4rem;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Responsive */
        @media (max-width: 600px) {
            header h1 { font-size: 1.5rem; }
            .stats-bar { gap: 1rem; }
            .news-card { padding: 1rem; }
            .news-card .title { font-size: 1rem; }
            .filter-bar { overflow-x: auto; flex-wrap: nowrap; }
        }
    </style>
</head>
<body>
    <header>
        <h1>🌿 Daily Carbon News</h1>
        <p>全球碳中和 · 每日境外媒体新闻聚合</p>
        <div class="update-badge">
            📅 更新日期: <span class="date" id="updateDate">--</span>
        </div>
    </header>

    <div class="stats-bar">
        <div class="stat-item">
            <div class="num" id="totalNews">0</div>
            <div class="label">新闻总数</div>
        </div>
        <div class="stat-item">
            <div class="num" id="totalSources">0</div>
            <div class="label">来源媒体</div>
        </div>
        <div class="stat-item">
            <div class="num" id="totalKeywords">0</div>
            <div class="label">匹配关键词</div>
        </div>
    </div>

    <div class="filter-bar" id="filterBar">
        <span class="label">🏷️ 关键词筛选:</span>
        <button class="filter-btn active" data-filter="all">全部</button>
    </div>
    <div class="filter-bar" id="timeFilterBar">
        <span class="label">🕐 时间范围:</span>
        <button class="filter-btn active" data-time="48h">最近 48 小时</button>
        <button class="filter-btn" data-time="7d">最近 7 天</button>
        <button class="filter-btn" data-time="all">全部</button>
        <span style="margin-left:auto;font-size:0.8rem;color:var(--text-secondary)" id="resultCount"></span>
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔍 搜索标题、来源、关键词..." />
    </div>

    <div class="container">
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>正在加载新闻数据...</p>
        </div>
        <div class="news-list" id="newsList"></div>
        <div class="empty-state" id="emptyState" style="display:none;">
            <div class="icon">📭</div>
            <h3>暂无匹配的新闻</h3>
            <p>试试更换关键词筛选或稍后再来看看</p>
        </div>
    </div>

    <footer>
        <p>数据来源: <a href="https://news.google.com/" target="_blank">Google News RSS</a></p>
        <p>每天自动更新 · <span id="footerDate"></span></p>
    </footer>

    <script>
        // 从 JSONP 或直接加载 JSON
        async function loadNews() {
            try {
                const resp = await fetch('data/news.json?v=' + Date.now());
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                return await resp.json();
            } catch (e) {
                console.warn('加载 news.json 失败, 使用空数据:', e);
                return [];
            }
        }

        function getAllKeywords(news) {
            const kwSet = new Set();
            news.forEach(item => {
                (item.matched_keywords || []).forEach(kw => kwSet.add(kw));
            });
            return Array.from(kwSet).sort();
        }

        function getUniqueSources(news) {
            const srcSet = new Set();
            news.forEach(item => {
                if (item.source) srcSet.add(item.source);
            });
            return srcSet.size;
        }

        // 全局状态
        let allNews = [];
        let currentTimeRange = '48h';

        function getTimeFiltered(news, range) {
            if (range === 'all') return news;
            const hours = range === '7d' ? 168 : 48;
            const cutoff = new Date(Date.now() - hours * 3600 * 1000);
            return news.filter(item => {
                if (!item.published) return false;
                const d = new Date(item.published.replace(' ', 'T') + '+08:00');
                return d >= cutoff;
            });
        }

        function render(news, activeKeyword) {
            const list = document.getElementById('newsList');
            const empty = document.getElementById('emptyState');

            // 先按时间过滤
            let filtered = getTimeFiltered(news, currentTimeRange);

            // 再按关键词过滤
            if (activeKeyword && activeKeyword !== 'all') {
                filtered = filtered.filter(item =>
                    (item.matched_keywords || []).some(kw =>
                        kw.toLowerCase().includes(activeKeyword.toLowerCase())
                    )
                );
            }

            // 更新计数
            document.getElementById('resultCount').textContent =
                `显示 ${filtered.length} / ${allNews.length} 条`;

            if (filtered.length === 0) {
                list.innerHTML = '';
                empty.style.display = 'block';
                return;
            }
            empty.style.display = 'none';

            list.innerHTML = filtered.map(item => {
                const keywords = (item.matched_keywords || []).map(kw =>
                    `<span class="kw">${kw}</span>`
                ).join('');

                const timeHtml = item.published
                    ? `<span class="time">🕐 ${item.published}</span>`
                    : '';

                const sourceHtml = item.source
                    ? `<span class="source">📰 ${item.source}</span>`
                    : '';

                const titleZh = item.title_zh && item.title_zh !== item.title
                    ? item.title_zh : null;
                const titleHtml = titleZh
                    ? `<div class="title-zh"><a href="${item.link}" target="_blank" rel="noopener">${titleZh}</a></div><div class="title-en">${item.title}</div>`
                    : `<div class="title-zh"><a href="${item.link}" target="_blank" rel="noopener">${item.title}</a></div>`;

                const snippetHtml = item.snippet
                    ? `<div class="snippet">${item.snippet}</div>`
                    : '';

                return `
                    <div class="news-card">
                        ${titleHtml}
                        <div class="meta">
                            ${sourceHtml}
                            ${timeHtml}
                        </div>
                        ${snippetHtml}
                        <div class="keywords">${keywords}</div>
                    </div>
                `;
            }).join('');
        }

        function setupFilters(news) {
            const bar = document.getElementById('filterBar');
            const keywords = getAllKeywords(news);

            bar.querySelectorAll('[data-filter]').forEach(el => {
                if (el.dataset.filter !== 'all') el.remove();
            });

            keywords.forEach(kw => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn keyword-tag';
                btn.dataset.filter = kw;
                btn.textContent = kw;
                btn.addEventListener('click', () => {
                    bar.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    render(allNews, kw);
                });
                bar.appendChild(btn);
            });

            const allBtn = bar.querySelector('[data-filter="all"]');
            allBtn.addEventListener('click', () => {
                bar.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                allBtn.classList.add('active');
                render(allNews, 'all');
            });
        }

        function setupSearch(news) {
            const input = document.getElementById('searchInput');
            input.addEventListener('input', () => {
                const q = input.value.trim().toLowerCase();
                if (!q) {
                    render(allNews, 'all');
                    return;
                }
                // 搜索全部数据（不受时间范围限制）
                const filtered = allNews.filter(item =>
                    item.title.toLowerCase().includes(q) ||
                    (item.title_zh || '').toLowerCase().includes(q) ||
                    (item.source || '').toLowerCase().includes(q) ||
                    (item.matched_keywords || []).some(kw => kw.toLowerCase().includes(q))
                );
                const list = document.getElementById('newsList');
                const empty = document.getElementById('emptyState');
                if (filtered.length === 0) {
                    list.innerHTML = '';
                    empty.style.display = 'block';
                } else {
                    empty.style.display = 'none';
                    document.getElementById('resultCount').textContent = `搜索到 ${filtered.length} / ${allNews.length} 条`;
                    list.innerHTML = filtered.map(item => {
                        const keywords = (item.matched_keywords || []).map(kw =>
                            `<span class="kw">${kw}</span>`
                        ).join('');
                        const timeHtml = item.published ? `<span class="time">🕐 ${item.published}</span>` : '';
                        const sourceHtml = item.source ? `<span class="source">📰 ${item.source}</span>` : '';
                        const titleZh = item.title_zh && item.title_zh !== item.title ? item.title_zh : null;
                        const titleHtml = titleZh
                            ? `<div class="title-zh"><a href="${item.link}" target="_blank" rel="noopener">${titleZh}</a></div><div class="title-en">${item.title}</div>`
                            : `<div class="title-zh"><a href="${item.link}" target="_blank" rel="noopener">${item.title}</a></div>`;
                        const snippetHtml = item.snippet ? `<div class="snippet">${item.snippet}</div>` : '';
                        return `
                            <div class="news-card">
                                ${titleHtml}
                                <div class="meta">${sourceHtml}${timeHtml}</div>
                                ${snippetHtml}
                                <div class="keywords">${keywords}</div>
                            </div>
                        `;
                    }).join('');
                }
            });
        }

        async function init() {
            const loading = document.getElementById('loading');
            allNews = await loadNews();
            loading.style.display = 'none';

            // Update stats
            document.getElementById('totalNews').textContent = allNews.length;
            document.getElementById('totalSources').textContent = getUniqueSources(allNews);
            document.getElementById('totalKeywords').textContent = getAllKeywords(allNews).length;

            // Update date
            const today = new Date();
            document.getElementById('updateDate').textContent =
                today.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' });
            document.getElementById('footerDate').textContent =
                today.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' });

            // Setup time filter
            document.querySelectorAll('[data-time]').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('[data-time]').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentTimeRange = btn.dataset.time;
                    const activeFilter = document.querySelector('.filter-btn.active');
                    const kw = activeFilter ? activeFilter.dataset.filter : 'all';
                    render(allNews, kw);
                });
            });

            // Setup
            setupFilters(allNews);
            setupSearch(allNews);
            render(allNews, 'all');
        }

        init();
    </script>
</body>
</html>
