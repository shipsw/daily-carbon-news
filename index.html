<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌿 Daily Carbon News - 全球碳中和日报</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f0f4f0;
            --card-bg: #ffffff;
            --text: #1a2a1a;
            --text-secondary: #5a6a5a;
            --accent: #2d8a4e;
            --accent-light: #e8f5e9;
            --accent-dark: #1b5e20;
            --tag-bg: #e8f5e9;
            --tag-text: #2d8a4e;
            --border: #dce8dc;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            --radius: 12px;
            --header-pad: 1.5rem;
            --section-pad: 0.8rem 1rem;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            padding: 1rem;
            -webkit-text-size-adjust: 100%;
        }

        /* ========== Header ========== */
        header {
            background: linear-gradient(135deg, #1b5e20 0%, #2d8a4e 50%, #43a047 100%);
            color: white;
            padding: 1.5rem 1rem;
            text-align: center;
            position: relative;
            overflow: hidden;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.10);
            max-width: 1000px;
            margin: 0 auto;
        }
        header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 50%, rgba(255,255,255,0.05) 0%, transparent 50%);
            pointer-events: none;
        }
        header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            position: relative;
        }
        header p {
            opacity: 0.85;
            margin-top: 0.3rem;
            font-size: 0.85rem;
            position: relative;
        }
        .update-badge {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            padding: 0.25rem 0.8rem;
            border-radius: 20px;
            font-size: 0.78rem;
            margin-top: 0.6rem;
            backdrop-filter: blur(4px);
        }
        .update-badge .date { font-weight: 600; }

        /* ========== Stats bar ========== */
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 1rem;
            padding: 0.7rem 1rem;
            background: var(--card-bg);
            border-radius: var(--radius);
            margin-top: 0.8rem;
            box-shadow: var(--shadow);
            flex-wrap: wrap;
            max-width: 1000px;
            margin-left: auto;
            margin-right: auto;
        }
        .stat-item { text-align: center; min-width: 60px; }
        .stat-item .num { font-size: 1.2rem; font-weight: 700; color: var(--accent); }
        .stat-item .label { font-size: 0.72rem; color: var(--text-secondary); white-space: nowrap; }

        /* ========== Filter bars (scrollable on mobile) ========== */
        .filter-bar {
            padding: 0.7rem 1rem;
            background: var(--card-bg);
            border-radius: var(--radius);
            margin-top: 0.6rem;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 0.4rem;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            white-space: nowrap;
            max-width: 1000px;
            margin-left: auto;
            margin-right: auto;
        }
        .filter-bar::-webkit-scrollbar { display: none; }
        .filter-bar .label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            flex-shrink: 0;
        }
        .filter-btn {
            padding: 0.3rem 0.7rem;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text);
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
            touch-action: manipulation;
        }
        .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
        .filter-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
        .keyword-tag.filter-btn {
            background: var(--tag-bg);
            color: var(--tag-text);
            border-color: transparent;
        }
        .keyword-tag.filter-btn.active { background: var(--accent); color: white; }
        .keyword-tag.filter-btn:hover { border-color: var(--accent); }

        /* ========== Search ========== */
        .search-box {
            padding: 0.7rem 1rem;
            background: var(--card-bg);
            border-radius: var(--radius);
            margin-top: 0.6rem;
            box-shadow: var(--shadow);
            max-width: 1000px;
            margin-left: auto;
            margin-right: auto;
        }
        .search-box input {
            width: 100%;
            padding: 0.6rem 0.9rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
            -webkit-appearance: none;
        }
        .search-box input:focus { border-color: var(--accent); }

        /* ========== Main content ========== */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0.8rem;
        }

        .news-list {
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
        }

        .news-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 1rem 1.1rem;
            box-shadow: var(--shadow);
            transition: transform 0.15s, box-shadow 0.15s;
            border-left: 4px solid var(--accent);
        }
        .news-card:active {
            transform: scale(0.995);
        }

        .news-card .title-zh {
            font-size: 0.95rem;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 0.15rem;
        }
        .news-card .title-zh a { color: var(--text); text-decoration: none; }
        .news-card .title-zh a:hover { color: var(--accent); text-decoration: underline; }
        .news-card .title-en {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 0.3rem;
            line-height: 1.3;
        }

        .news-card .meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
        }
        .news-card .meta .source { font-weight: 600; color: var(--accent-dark); }

        .news-card .snippet {
            font-size: 0.82rem;
            color: var(--text-secondary);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .news-card .keywords {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
            margin-top: 0.5rem;
        }
        .news-card .keywords .kw {
            display: inline-block;
            background: var(--tag-bg);
            color: var(--tag-text);
            padding: 0.1rem 0.5rem;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 500;
        }

        /* ========== Empty state ========== */
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-secondary);
        }
        .empty-state .icon { font-size: 2.5rem; margin-bottom: 0.8rem; }
        .empty-state h3 { font-size: 1.1rem; margin-bottom: 0.4rem; color: var(--text); }

        /* ========== Footer ========== */
        footer {
            text-align: center;
            padding: 1.5rem 1rem;
            color: var(--text-secondary);
            font-size: 0.75rem;
        }
        footer a { color: var(--accent); text-decoration: none; }

        /* ========== Loading ========== */
        .loading { text-align: center; padding: 3rem; }
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 0.8rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ========== Desktop (≥768px) ========== */
        @media (min-width: 768px) {
            body { padding: 1.5rem; }
            header { padding: 2rem 1.5rem; }
            header h1 { font-size: 2rem; }
            header p { font-size: 1rem; }
            .stats-bar { gap: 2rem; padding: 1rem 1.5rem; }
            .stat-item .num { font-size: 1.5rem; }
            .stat-item .label { font-size: 0.8rem; }
            .filter-bar { padding: 0.8rem 1.5rem; gap: 0.5rem; white-space: normal; flex-wrap: wrap; overflow-x: visible; }
            .filter-btn { font-size: 0.8rem; padding: 0.35rem 0.8rem; }
            .search-box { padding: 1rem 1.5rem; }
            .container { padding: 1.2rem 0; }
            .news-list { gap: 1rem; }
            .news-card { padding: 1.25rem 1.5rem; }
            .news-card .title-zh { font-size: 1.1rem; }
            .news-card .title-en { font-size: 0.82rem; }
            .news-card .meta { font-size: 0.82rem; gap: 0.8rem; }
            .news-card .snippet { font-size: 0.88rem; }
            .news-card .keywords .kw { font-size: 0.75rem; }
            .short-link {
                display: inline-block;
                font-size: 0.7rem;
                padding: 0.05rem 0.45rem;
                border-radius: 8px;
                background: #e3f2fd;
                color: #1565c0;
                cursor: pointer;
                transition: all 0.2s;
                user-select: none;
                touch-action: manipulation;
                border: 1px solid #bbdefb;
                font-weight: 500;
            }
            .short-link:hover { background: #1565c0; color: white; border-color: #1565c0; }
            .short-link.copied { background: #2d8a4e; color: white; border-color: #2d8a4e; }
            .filter-bar .label { font-size: 0.85rem; }
        }

        /* ========== Small mobile (≤400px) ========== */
        @media (max-width: 400px) {
            body { padding: 0.5rem; }
            header h1 { font-size: 1.2rem; }
            .stats-bar { gap: 0.6rem; }
            .stat-item { min-width: 50px; }
            .stat-item .num { font-size: 1rem; }
            .news-card { padding: 0.8rem 0.9rem; border-left-width: 3px; }
            .news-card .title-zh { font-size: 0.88rem; }
            .container { padding: 0.6rem 0; }
            .news-list { gap: 0.5rem; }
        }
    </style>
</head>
<body>
    <header>
        <h1>🌿 Daily Carbon News</h1>
        <p>全球碳中和 · 每日国际媒体新闻聚合</p>
        <div class="update-badge">
            📅 更新日期: <span class="date" id="updateDate">--</span>
        </div>
    </header>

    <div class="stats-bar">
        <div class="stat-item">
            <div class="num" id="totalNews">0</div>
            <div class="label">新闻总数</div>
        </div>
        <div class="stat-item">
            <div class="num" id="totalSources">0</div>
            <div class="label">来源媒体</div>
        </div>
        <div class="stat-item">
            <div class="num" id="totalKeywords">0</div>
            <div class="label">匹配关键词</div>
        </div>
    </div>

    <div class="filter-bar" id="filterBar">
        <span class="label">🏷️ 关键词筛选:</span>
        <button class="filter-btn active" data-filter="all">全部</button>
    </div>
    <div class="filter-bar" id="timeFilterBar">
        <span class="label">🕐 时间范围:</span>
        <button class="filter-btn" data-time="24h">最近 24 小时</button>
        <button class="filter-btn active" data-time="48h">最近 48 小时</button>
        <button class="filter-btn" data-time="7d">最近 7 天</button>
        <button class="filter-btn" data-time="all">全部</button>
        <span style="margin-left:auto;font-size:0.8rem;color:var(--text-secondary)" id="resultCount"></span>
        <button class="filter-btn" id="exportBtn" style="background:var(--accent);color:white;border:none;font-weight:600;">📥 导出 Excel</button>
    </div>
    <div class="filter-bar" id="mediaFilterBar" style="padding:0.4rem 1rem;gap:0.4rem;margin-top:0.4rem;">
        <span class="label">📡 媒体:</span>
        <button class="filter-btn active" data-tag="all" style="font-size:0.7rem;padding:0.15rem 0.5rem;">全部</button>
        <button class="filter-btn" data-tag="🛡️" style="font-size:0.7rem;padding:0.15rem 0.5rem;background:#fff3e0;border-color:#ffb74d;">🛡️ 需代理</button>
        <button class="filter-btn" data-tag="💳" style="font-size:0.7rem;padding:0.15rem 0.5rem;background:#fce4ec;border-color:#e57373;">💳 需订阅</button>
        <button class="filter-btn" data-tag="🔓" style="font-size:0.7rem;padding:0.15rem 0.5rem;background:#e8f5e9;border-color:#81c784;">🔓 公开</button>
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔍 搜索标题、来源、关键词..." />
    </div>

    <div class="container">
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>正在加载新闻数据...</p>
        </div>
        <div class="news-list" id="newsList"></div>
        <div class="empty-state" id="emptyState" style="display:none;">
            <div class="icon">📭</div>
            <h3>暂无匹配的新闻</h3>
            <p>试试更换关键词筛选或稍后再来看看</p>
        </div>
    </div>

    <footer>
        <p>数据来源: <a href="https://news.google.com/" target="_blank">Google News</a> · 点击新闻标题自动跳转原文</p>
        <p>每天自动更新 · <span id="footerDate"></span></p>
    </footer>

    <script>
        // 从 JSONP 或直接加载 JSON
        async function loadNews() {
            try {
                const resp = await fetch('data/news.json?v=' + Date.now());
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                return await resp.json();
            } catch (e) {
                console.warn('加载 news.json 失败, 使用空数据:', e);
                return [];
            }
        }

        function getAllKeywords(news) {
            const kwSet = new Set();
            news.forEach(item => {
                (item.matched_keywords || []).forEach(kw => kwSet.add(kw));
            });
            return Array.from(kwSet).sort();
        }

        function getUniqueSources(news) {
            const srcSet = new Set();
            news.forEach(item => {
                if (item.source) srcSet.add(item.source);
            });
            return srcSet.size;
        }

        // 全局状态
        let allNews = [];
        let currentTimeRange = '48h';
        let currentTag = 'all';

        // 媒体标签映射（按名称匹配，覆盖实际数据中的来源名）
        const mediaTags = {
            '🛡️💳': ['new york times', 'nytimes', 'washington post', 'washingtonpost',
                      'wall street journal', 'wsj', 'the times', 'thetimes',
                      'daily telegraph', 'telegraph', 'financial times', 'ft.com',
                      'los angeles times', 'latimes'],
            '🛡️🔓': ['cnn'],
            '🔓💳': ['bloomberg'],
            '🔓': ['the guardian', 'guardian', 'bbc', 'reuters', 'independent',
                   'euronews', 'politico', 'afp', 'euractiv', 'elpais',
                   'usa today', 'usatoday', 'dailymail', 'daily mail',
                   'the sun', 'thesun', 'ap news', 'axios', 'forbes',
                   'npr', 'the hill', 'time', 'newsweek',
                   'carbon brief', 'inside climate', 'canary media',
                   'e&e news', 'grist', 'the conversation'],
            '💳': ['business times', 'straits times', 'economist'],
        };
        function getMediaTags(source) {
            if (!source) return '';
            const s = source.toLowerCase();
            for (const [tags, names] of Object.entries(mediaTags)) {
                for (const name of names) {
                    if (s.includes(name)) return tags;
                }
            }
            return '';
        }

        // 来源中文名映射
        function getSourceZh(source) {
            if (!source) return source;
            const s = source.toLowerCase();
            const map = [
                ['new york times', '纽约时报'],
                ['washington post', '华盛顿邮报'],
                ['wall street journal', '华尔街日报'],
                ['wsj', '华尔街日报'],
                ['los angeles times', '洛杉矶时报'],
                ['latimes', '洛杉矶时报'],
                ['usa today', '今日美国'],

                ['cnn', 'CNN'],
                ['the times', '泰晤士报'],
                ['the guardian', '卫报'],
                ['daily telegraph', '每日电讯报'],

                ['times of malta', '马耳他时报'],
                ['times union', '时代联合报'],

            for (const [key, zh] of map) {
                if (s.includes(key)) return zh;
            }
            return source;  // 没匹配则返回原名
        }

        // 来源国家映射
        const countryMap = [
            ['new york times', '🇺🇸 美国'],
            ['washington post', '🇺🇸 美国'],
            ['wall street journal', '🇺🇸 美国'],

            ['euronews', '🇪🇺 欧洲'],

            ['euractiv', '🇪🇺 欧洲'],
            ['el pais', '🇪🇸 西班牙'],
            ['paÍs', '🇪🇸 西班牙'],

            ['time magazine', '🇺🇸 美国'],

            ['economist', '🇬🇧 英国'],

            ['inside climate', '🇺🇸 美国'],

            ['sap news', '🇩🇪 德国'],
            ['ieefa', '🇺🇸 美国'],
            ['economictimes', '🇮🇳 印度'],
            ['newtimes.co.rw', '🇷🇼 卢旺达'],
            ['tasmanian times', '🇦🇺 澳大利亚'],
            ['times of malta', '🇲🇹 马耳他'],
            ['times union', '🇺🇸 美国'],
        ];
        function getSourceCountry(source) {
            if (!source) return '';
            const s = source.toLowerCase();
            for (const [key, country] of countryMap) {
                if (s.includes(key)) return country;
            }
            return '';
        }

        // 从来源名提取短域名显示
        const domainMap = {
            'new york times': 'nytimes.com',
            'washington post': 'washingtonpost.com',
            'wall street journal': 'wsj.com',
            'wsj': 'wsj.com',
            'los angeles times': 'latimes.com',
            'usa today': 'usatoday.com',
            'bloomberg': 'bloomberg.com',
            'cnn': 'cnn.com',
            'the times': 'thetimes.co.uk',
            'the guardian': 'theguardian.com',
            'daily telegraph': 'telegraph.co.uk',
            'telegraph': 'telegraph.co.uk',
            'the independent': 'independent.co.uk',
            'financial times': 'ft.com',
            'daily mail': 'dailymail.co.uk',
            'the sun': 'thesun.co.uk',
            'bbc': 'bbc.com',
            'reuters': 'reuters.com',
            'euronews': 'euronews.com',
            'politico': 'politico.eu',
            'afp': 'afp.com',
            'euractiv': 'euractiv.com',
            'el pais': 'elpais.com',
            'país': 'elpais.com',
            'business times': 'businesstimes.com.sg',
            'straits times': 'straitstimes.com',
            'ap news': 'apnews.com',
            'axios': 'axios.com',
            'forbes': 'forbes.com',
            'npr': 'npr.org',
            'the hill': 'thehill.com',
            'time magazine': 'time.com',
            'newsweek': 'newsweek.com',
            'economist': 'economist.com',
            'carbon brief': 'carbonbrief.org',
            'inside climate': 'insideclimatenews.org',
            'canary media': 'canarymedia.com',
            'grist': 'grist.org',
            'the conversation': 'theconversation.com',
            'e&e news': 'eenews.net',
            'bloombergnef': 'about.bnef.com',
            'aspen times': 'aspentimes.com',
            'tech times': 'techtimes.com',
            'times higher education': 'timeshighereducation.com',
            'sap': 'sap.com',
            'ieefa': 'ieefa.org',
            'economictimes': 'economictimes.indiatimes.com',
            'newtimes': 'newtimes.co.rw',
            'tasmanian times': 'tasmaniantimes.com',
            'times of malta': 'timesofmalta.com',
            'times union': 'timesunion.com',
        };
        function getCleanDomain(source) {
            if (!source) return '';
            const s = source.toLowerCase();
            for (const [key, domain] of Object.entries(domainMap)) {
                if (s.includes(key)) return domain;
            }
            return '';
        }

        function getTimeFiltered(news, range) {
            if (range === 'all') return news;
            const hours = range === '24h' ? 24 : range === '48h' ? 48 : 168;
            const cutoff = new Date(Date.now() - hours * 3600 * 1000);
            return news.filter(item => {
                if (!item.published) return false;
                const d = new Date(item.published.replace(' ', 'T') + '+08:00');
                return d >= cutoff;
            });
        }

        function render(news, activeKeyword) {
            const list = document.getElementById('newsList');
            const empty = document.getElementById('emptyState');

            // 先按时间过滤
            let filtered = getTimeFiltered(news, currentTimeRange);

            // 再按关键词过滤
            if (activeKeyword && activeKeyword !== 'all') {
                filtered = filtered.filter(item =>
                    (item.matched_keywords || []).some(kw =>
                        kw.toLowerCase().includes(activeKeyword.toLowerCase())
                    )
                );
            }

            // 再按媒体标签过滤
            if (currentTag && currentTag !== 'all') {
                filtered = filtered.filter(item => {
                    const tags = getMediaTags(item.source);
                    return tags.includes(currentTag);
                });
            }

            // 更新计数
            document.getElementById('resultCount').textContent =
                `显示 ${filtered.length} / ${allNews.length} 条`;

            if (filtered.length === 0) {
                list.innerHTML = '';
                empty.style.display = 'block';
                return;
            }
            empty.style.display = 'none';

            list.innerHTML = filtered.map(item => {
                const keywords = (item.matched_keywords || []).map(kw =>
                    `<span class="kw">${kw}</span>`
                ).join('');

                const timeHtml = item.published
                    ? `<span class="time">🕐 ${item.published}</span>`
                    : '';

                const sourceHtml = item.source
                    ? `<span class="source">📰 ${getSourceZh(item.source)} ${getSourceCountry(item.source)}</span>`
                    : '';

                // 媒体标签（放在标题前）
                const tags = getMediaTags(item.source);
                const tagHtml = tags ? `<span style="font-size:0.75rem;margin-right:0.4rem;">${tags}</span>` : '';

                const titleZh = item.title_zh && item.title_zh !== item.title
                    ? item.title_zh : null;
                const linkDomain = getCleanDomain(item.source);
                const linkBadge = linkDomain ? ` <span style="font-size:0.72rem;color:#889;font-weight:400;">🔗${linkDomain}</span>` : '';
                const linkUrl = item.short_link || item.link;
                const shortLink = item.short_link || '';
                const shortLinkHtml = shortLink
                    ? `<span class="short-link" onclick="copyShortLink('${shortLink}', event)" title="点击复制短链接">🔗 短链</span>`
                    : '';
                const titleHtml = titleZh
                    ? `<div class="title-zh">${tagHtml}<a href="${linkUrl}" target="_blank" rel="noopener">${titleZh}</a>${linkBadge}</div><div class="title-en">${item.title}</div>`
                    : `<div class="title-zh">${tagHtml}<a href="${linkUrl}" target="_blank" rel="noopener">${item.title}</a>${linkBadge}</div>`;

                const snippetHtml = item.snippet
                    ? `<div class="snippet">${item.snippet}</div>`
                    : '';

                return `
                    <div class="news-card">
                        ${titleHtml}
                        <div class="meta">
                            ${sourceHtml}
                            ${timeHtml}
                            ${shortLinkHtml}
                        </div>
                        ${snippetHtml}
                        <div class="keywords">${keywords}</div>
                    </div>
                `;
            }).join('');
        }

        function setupFilters(news) {
            const bar = document.getElementById('filterBar');
            const keywords = getAllKeywords(news);

            bar.querySelectorAll('[data-filter]').forEach(el => {
                if (el.dataset.filter !== 'all') el.remove();
            });

            keywords.forEach(kw => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn keyword-tag';
                btn.dataset.filter = kw;
                btn.textContent = kw;
                btn.addEventListener('click', () => {
                    bar.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    render(allNews, kw);
                });
                bar.appendChild(btn);
            });

            const allBtn = bar.querySelector('[data-filter="all"]');
            allBtn.addEventListener('click', () => {
                bar.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                allBtn.classList.add('active');
                render(allNews, 'all');
            });
        }

        function setupSearch(news) {
            const input = document.getElementById('searchInput');
            input.addEventListener('input', () => {
                const q = input.value.trim().toLowerCase();
                if (!q) {
                    render(allNews, 'all');
                    return;
                }
                // 搜索全部数据（不受时间范围限制）
                const filtered = allNews.filter(item =>
                    item.title.toLowerCase().includes(q) ||
                    (item.title_zh || '').toLowerCase().includes(q) ||
                    (item.source || '').toLowerCase().includes(q) ||
                    (item.matched_keywords || []).some(kw => kw.toLowerCase().includes(q))
                );
                const list = document.getElementById('newsList');
                const empty = document.getElementById('emptyState');
                if (filtered.length === 0) {
                    list.innerHTML = '';
                    empty.style.display = 'block';
                } else {
                    empty.style.display = 'none';
                    document.getElementById('resultCount').textContent = `搜索到 ${filtered.length} / ${allNews.length} 条`;
                    list.innerHTML = filtered.map(item => {
                        const keywords = (item.matched_keywords || []).map(kw =>
                            `<span class="kw">${kw}</span>`
                        ).join('');
                        const timeHtml = item.published ? `<span class="time">🕐 ${item.published}</span>` : '';
                        const sourceHtml = item.source ? `<span class="source">📰 ${getSourceZh(item.source)} ${getSourceCountry(item.source)}</span>` : '';
                        const tags = getMediaTags(item.source);
                        const tagHtml = tags ? `<span style="font-size:0.75rem;margin-right:0.4rem;">${tags}</span>` : '';
                        const titleZh = item.title_zh && item.title_zh !== item.title ? item.title_zh : null;
                        const linkDomain = getCleanDomain(item.source);
                        const linkBadge = linkDomain ? ` <span style="font-size:0.72rem;color:#889;font-weight:400;">🔗${linkDomain}</span>` : '';
                        const linkUrl = item.short_link || item.link;
                        const shortLink = item.short_link || '';
                        const shortLinkHtml = shortLink
                            ? `<span class="short-link" onclick="copyShortLink('${shortLink}', event)" title="点击复制短链接">🔗 短链</span>`
                            : '';
                        const titleHtml = titleZh
                            ? `<div class="title-zh">${tagHtml}<a href="${linkUrl}" target="_blank" rel="noopener">${titleZh}</a>${linkBadge}</div><div class="title-en">${item.title}</div>`
                            : `<div class="title-zh">${tagHtml}<a href="${linkUrl}" target="_blank" rel="noopener">${item.title}</a>${linkBadge}</div>`;
                        const snippetHtml = item.snippet ? `<div class="snippet">${item.snippet}</div>` : '';
                        return `
                            <div class="news-card">
                                ${titleHtml}
                                <div class="meta">${sourceHtml}${timeHtml}${shortLinkHtml}</div>
                                ${snippetHtml}
                                <div class="keywords">${keywords}</div>
                            </div>
                        `;
                    }).join('');
                }
            });
        }

        async function init() {
            const loading = document.getElementById('loading');
            allNews = await loadNews();
            loading.style.display = 'none';

            // Update stats
            document.getElementById('totalNews').textContent = allNews.length;
            document.getElementById('totalSources').textContent = getUniqueSources(allNews);
            document.getElementById('totalKeywords').textContent = getAllKeywords(allNews).length;

            // Update date
            const today = new Date();
            document.getElementById('updateDate').textContent =
                today.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' });
            document.getElementById('footerDate').textContent =
                today.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' });

            // Setup time filter
            document.querySelectorAll('[data-time]').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('[data-time]').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentTimeRange = btn.dataset.time;
                    const activeFilter = document.querySelector('.filter-btn.active');
                    const kw = activeFilter ? activeFilter.dataset.filter : 'all';
                    render(allNews, kw);
                });
            });

            // Setup
            setupFilters(allNews);
            setupSearch(allNews);
            render(allNews, 'all');

            // 媒体标签筛选
            document.querySelectorAll('[data-tag]').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('[data-tag]').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentTag = btn.dataset.tag;
                    const activeFilter = document.querySelector('.filter-btn.active');
                    const kw = activeFilter ? activeFilter.dataset.filter : 'all';
                    render(allNews, kw);
                });
            });

            // 导出 Excel
            document.getElementById('exportBtn').addEventListener('click', () => {
                const activeFilter = document.querySelector('.filter-btn.active');
                const kw = activeFilter ? activeFilter.dataset.filter : 'all';
                let data = allNews;
                if (kw && kw !== 'all') {
                    data = data.filter(item =>
                        (item.matched_keywords || []).some(k =>
                            k.toLowerCase().includes(kw.toLowerCase())
                        )
                    );
                }
                if (currentTag && currentTag !== 'all') {
                    data = data.filter(item => {
                        const tags = getMediaTags(item.source);
                        return tags.includes(currentTag);
                    });
                }
                data = getTimeFiltered(data, currentTimeRange);
                exportToXLSX(data);
            });
        }

        function exportToXLSX(data) {
            if (typeof XLSX === 'undefined') {
                // 动态加载 SheetJS
                const s = document.createElement('script');
                s.src = 'https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js';
                s.onload = () => doExport(data);
                document.head.appendChild(s);
            } else {
                doExport(data);
            }
        }

        function doExport(data) {
            const rows = data.map((item, i) => ({
                '序号': i + 1,
                '中文标题': item.title_zh || item.title,
                '英文标题': item.title,
                '来源': getSourceZh(item.source) || item.source || '',
                '来源国': getSourceCountry(item.source) || '',
                '媒体标注': (() => {
                    const t = getMediaTags(item.source);
                    const labels = [];
                    if (t.includes('🛡')) labels.push('需代理');
                    if (t.includes('💳')) labels.push('需订阅');
                    if (t.includes('🔓')) labels.push('公开');
                    return labels.join('、');
                })(),
                '发布时间': item.published || '',
                '摘要': (item.snippet || '').replace(/<[^>]+>/g, ''),
                '链接': item.link || '',
                '短链': getCleanDomain(item.source) ? `https://${getCleanDomain(item.source)}` : item.link || '',
                '匹配关键词': (item.matched_keywords || []).join('、'),
            }));
            const ws = XLSX.utils.json_to_sheet(rows);
            ws['!cols'] = [
                {wch:5}, {wch:45}, {wch:45}, {wch:20}, {wch:12}, {wch:14}, {wch:20}, {wch:50}, {wch:30}, {wch:25}
            ];
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, '新闻数据');
            XLSX.writeFile(wb, `DailyCarbonNews_${new Date().toISOString().slice(0,10)}.xlsx`);
        }

        // 复制短链接到剪贴板
        function copyShortLink(shortPath, event) {
            event.stopPropagation();
            // 基于当前页面路径解析完整 URL（兼容子路径部署，如 /daily-carbon-news/）
            const fullUrl = new URL(shortPath, window.location.href).href;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(fullUrl).then(() => {
                    showCopiedFeedback(event.target);
                }).catch(() => {
                    fallbackCopy(fullUrl, event.target);
                });
            } else {
                fallbackCopy(fullUrl, event.target);
            }
        }

        function fallbackCopy(text, el) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showCopiedFeedback(el);
            } catch (e) {
                // 都不行就提示手动复制
                alert('短链接: ' + text);
            }
            document.body.removeChild(textarea);
        }

        function showCopiedFeedback(el) {
            const originalText = el.textContent;
            el.textContent = '✅ 已复制';
            el.classList.add('copied');
            setTimeout(() => {
                el.textContent = originalText;
                el.classList.remove('copied');
            }, 2000);
        }

        init();
    </script>
